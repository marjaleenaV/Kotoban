<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kotoban</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>

   <h1>Kotoban</h1>
   
   
    <form th:action="@{/index}" method="get">
	<input class="btn btn-outline-dark  rounded-pill mt-4" type="submit" value="Back" />

    <table class="table table-striped">
  <tr>
   <th>Japanese</th>
   <th>Readings</th>
   <th>Meaning</th>
   <th sec:authorize="hasAuthority('ADMIN')"> </th>
   
  </tr>
     <tr th:each = "word : ${words}">
       <td th:text="${word.japanese}"></td>
       <td th:text="${word.reading}"></td>
        <td th:text="${word.meaning}"></td>
         <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger" th:href="@{/delete/{id}(id=${word.id})}">Delete</a></td>
     </tr>
</table>
</form>

</body>
</html>
