<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Kotoban</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>
<body>
<nav class="navbar bg-white border-bottom">

        <div class="container">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-dark rounded-pill">Sign out</button>
            </form>
        </div>
    </nav>
    <main class="container py-5" style="text-align: center;">
        <div class="py-4">
   <h1 class="display-4 fw-bold">Kotoban</h1>
   
   
    <form th:action="@{/index}" method="get">
	<input class="btn btn-outline-dark  rounded-pill" style="text-align: left;" type="submit" value="Back" />

    <table class="table table-striped mt-4">
  <tr>
   <th>Japanese</th>
   <th>Readings</th>
   <th>Meaning</th>
   <th>Category</th>
   <th sec:authorize="hasAuthority('ADMIN')"> </th>
   
  </tr>
     <tr th:each = "word : ${words}">
       <td th:text="${word.japanese}"></td>
       <td th:text="${word.reading}"></td>
        <td th:text="${word.meaning}"></td>
        <td th:text="${word.wordCategory.getWordCategory}"></td>
         <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger" th:href="@{/delete/{id}(id=${word.id})}">Delete</a></td>
     </tr>
</table>
</form>
        </div>
    </main>

</body>
</html>
