<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />

    <title>Login</title>
</head>

<body>
    <nav class="navbar bg-white border-bottom">
    </nav>
    <main class="container py-5" style="text-align: center;">
        <div class="py-4">
            <h1 class="display-4 fw-bold">Welcome to Kotoban!</h1>
            <h3>Please Sign in</h3>
    <div th:if="${param.error}" style="color: red">
        Invalid username and password.
    </div>
    <div th:if="${param.logout}" style="color: rgb(9, 120, 13)">
        You have been logged out.
    </div>
    <form th:action="@{/login}" method="post">
        <div><label> User Name : <input type="text" name="username" /> </label></div>
        <div><label> Password: <input type="password" name="password" /> </label></div>
        <div><button type="submit" class="btn btn-outline-dark rounded-pill">Sign in</div>
    </form>
    <form>
    <div><a th:href="@{/signup}">Sign-up</a></div>
    </form>
        </div>
    </main>
    
</body>

</html>
