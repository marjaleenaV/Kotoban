<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Kotoban</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />
</head>

<body>
    <nav class="navbar bg-white border-bottom">

        <div class="container">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-dark rounded-pill">Sign out</button>
            </form>
        </div>
    </nav>
    <main class="container py-5" style="text-align: center;">
        <div class="py-4">
            <h1 class="display-4 fw-bold">Create a new wordlist</h1>


            <form th:action="@{/savelist}" th:object="${wordlist}" method="post">
                <label>List name
                    <input type="text" th:field="*{listName}" required>
                </label>
                <button type="submit">Create</button>
            </form>
        </div>
    </main>

</body>

</html>
