<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
    xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">

<head>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <title>Categories</title>
</head>

<body>
    <nav class="navbar bg-white border-bottom">

        <div class="container">
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-dark rounded-pill">Sign out</button>
            </form>
        </div>
    </nav>
    <main class="container py-5" style="text-align: center;">
        <div class="py-4">
            <h1 class="display-4 fw-bold">Categories</h1>

            <p th:if="${#lists.isEmpty(categories)}">Categories will be there soon.</p>

            <ul class="list-group">
                <li class="list-group-item" th:each="list : ${categories}">
                    <a class="btn btn-outline-dark" type="button" th:href="@{/categories/quiz/{categoryId}(categoryId=${list.categoryId})}" th:text="${list.wordCategory}"></a>
                    <a sec:authorize="hasAuthority('ADMIN')" class="btn" title="Edit Category" type="button" th:href="@{/admin/categories/{categoryId}(categoryId=${list.categoryId})}">✏️</a>
                    <a sec:authorize="hasAuthority('ADMIN')" class="btn" title="Delete Category" th:href="@{/admin/categories/{id}/delete(id=${list.categoryId})}">🚫</a>
                </li>
            </ul>
            <form th:action="@{/admin/categoryform}" method="get">
                <input sec:authorize="hasAuthority('ADMIN')" class="btn btn-success mt-4" type="submit" value="Create a new category" />
            </form>

            <a th:href="@{/index}" class="btn btn-outline-dark  rounded-pill mt-4">Back</a>

    
</body>

</html>
